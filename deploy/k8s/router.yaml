# The router in front of the regions (docs/server.md, Several regions): stateless, so any number of
# replicas, in any cluster, behind a global load balancer or GeoDNS. Each region runs the rest of deploy/k8s/
# with its own "region" in service.json; the router reaches each region's service at its public URL. The
# tenants' key hashes here are the ones in the regions' configs.
apiVersion: v1
kind: ConfigMap
metadata:
  name: jig-router-config
  namespace: jig
data:
  router.json: |
    {
      "listen": { "host": "0.0.0.0", "port": 8090 },
      "metrics": { "host": "0.0.0.0", "port": 9182 },
      "regions": [
        { "name": "eu", "url": "https://jig-eu.example.com" },
        { "name": "us", "url": "https://jig-us.example.com" }
      ],
      "tenants": [],
      "health": { "intervalMs": 5000, "failures": 2 }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jig-router
  namespace: jig
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: jig
      app.kubernetes.io/component: router
  template:
    metadata:
      labels:
        app.kubernetes.io/name: jig
        app.kubernetes.io/component: router
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9182"
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: router
          image: registry.example.com/jig-server:0.1.0
          command: ["node", "server/router.ts", "--config", "/etc/jig/router.json"]
          ports:
            - containerPort: 8090
            # GET /metrics and /healthz alone, for Prometheus; not in the Service below.
            - containerPort: 9182
              name: metrics
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8090
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: config
              mountPath: /etc/jig
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: jig-router-config
---
apiVersion: v1
kind: Service
metadata:
  name: jig-router
  namespace: jig
spec:
  selector:
    app.kubernetes.io/name: jig
    app.kubernetes.io/component: router
  ports:
    - port: 8090
      targetPort: 8090
---
# Who reaches the router's pods: the tenants from anywhere (the load balancer in front of it), and the
# metrics listener only from the monitoring namespace, as for the service and the gateway (networkpolicy.yaml).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: jig-router
  namespace: jig
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: jig
      app.kubernetes.io/component: router
  policyTypes:
    - Ingress
  ingress:
    - ports:
        - protocol: TCP
          port: 8090
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - protocol: TCP
          port: 9182
