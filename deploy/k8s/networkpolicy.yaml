# The task pods (server/runners/k8s.ts labels them) reach the gateway, the service's internal listener (where
# they ask for approvals) and the cluster's DNS, nothing else, and nothing reaches them. It holds only where the cluster's network plugin enforces NetworkPolicy. A git
# workspace is cloned in the pod, so a task with one needs its git host allowed too, by a rule like
#   - to: [{ipBlock: {cidr: <the host's addresses>}}]
#     ports: [{protocol: TCP, port: 443}]
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: jig-task
  namespace: jig
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: jig
      app.kubernetes.io/component: task
  policyTypes:
    - Ingress
    - Egress
  ingress: []
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: jig
              app.kubernetes.io/component: gateway
      ports:
        - protocol: TCP
          port: 8081
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: jig
              app.kubernetes.io/component: api
      ports:
        - protocol: TCP
          port: 8082
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
