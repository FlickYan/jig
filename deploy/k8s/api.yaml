# The task service: two replicas sharing one Postgres database, whose URL (with its password) comes from
# the jig-database Secret, yours to make:
#   kubectl -n jig create secret generic jig-database --from-literal=url='postgres://jig:...@postgres.example.com:5432/jig?sslmode=require'
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jig-api
  namespace: jig
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: jig
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: jig
        app.kubernetes.io/component: api
    spec:
      serviceAccountName: jig-api
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: registry.example.com/jig-server:0.1.0
          command: ["node", "server/api.ts", "--config", "/etc/jig/service.json"]
          ports:
            - containerPort: 8080
          env:
            - name: JIG_GATEWAY_SECRET
              valueFrom:
                secretKeyRef:
                  name: jig-secrets
                  key: gateway-secret
            - name: JIG_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: jig-database
                  key: url
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: config
              mountPath: /etc/jig
              readOnly: true
            - name: data
              mountPath: /var/lib/jig
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          configMap:
            name: jig-config
        # The Kubernetes runner keeps nothing of a task's here: the state is in the database.
        - name: data
          emptyDir: {}
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: jig-api
  namespace: jig
spec:
  selector:
    app.kubernetes.io/name: jig
    app.kubernetes.io/component: api
  ports:
    - port: 8080
      targetPort: 8080
