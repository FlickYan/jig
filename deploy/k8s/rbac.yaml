# The task service's account, which starts each task as a Job (server/runners/k8s.ts), and the tasks' own,
# which may do nothing and whose token their pods don't get.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: jig-api
  namespace: jig
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: jig-api
  namespace: jig
rules:
  # patch: a warm worker's Job gets its task's deadline and labels (docs/server.md, Warm pools). list: the
  # Jobs a crashed replica left are found by their task's label, and deleted.
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "get", "list", "patch", "delete"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: jig-api
  namespace: jig
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: jig-api
subjects:
  - kind: ServiceAccount
    name: jig-api
    namespace: jig
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: jig-task
  namespace: jig
automountServiceAccountToken: false
