# The task service's config (docs/server.md), and below it the gateway's (jig-gateway-config). The
# secrets go in jig-secrets (gateway-secret), jig-database (url, the Postgres database the service's
# replicas share, which the service reads as JIG_DATABASE_URL in place of "database") and jig-provider-keys
# (the variables the gateway's config names), none of them here:
#   kubectl -n jig create secret generic jig-secrets --from-literal=gateway-secret=$(openssl rand -hex 32)
apiVersion: v1
kind: ConfigMap
metadata:
  name: jig-config
  namespace: jig
data:
  service.json: |
    {
      "host": "0.0.0.0",
      "port": 8080,
      "dataDir": "/var/lib/jig",
      "concurrency": 50,
      "model": "deepseek-flash",
      "gatewayBaseUrl": "http://jig-gateway.jig.svc:8081/anthropic",
      "internal": { "host": "0.0.0.0", "port": 8082 },
      "internalBaseUrl": "http://jig-api-internal.jig.svc:8082",
      "runner": "kubernetes",
      "kubernetes": { "image": "registry.example.com/jig-worker:0.1.0", "ttlSecondsAfterFinished": 600 },
      "tenants": []
    }
---
# The gateway's config: the provider and the variables (in jig-provider-keys) that hold its keys, and the limits.
apiVersion: v1
kind: ConfigMap
metadata:
  name: jig-gateway-config
  namespace: jig
data:
  gateway.json: |
    {
      "listen": { "host": "0.0.0.0", "port": 8081 },
      "upstream": { "baseUrl": "https://api.deepseek.com/anthropic", "keyEnv": ["DEEPSEEK_API_KEY"] },
      "limits": { "concurrent": 256, "maxWaitMs": 30000, "tenantDefaults": { "requestsPerMinute": 120, "concurrent": 16 } }
    }
