# The task service's config (docs/server.md). The gateway's goes in jig-gateway-config, its key
# gateway.json, and the secrets in jig-secrets (gateway-secret) and jig-provider-keys (the variables the
# gateway's config names), none of them here:
#   kubectl -n jig create secret generic jig-secrets --from-literal=gateway-secret=$(openssl rand -hex 32)
apiVersion: v1
kind: ConfigMap
metadata:
  name: jig-config
  namespace: jig
data:
  service.json: |
    {
      "host": "0.0.0.0",
      "port": 8080,
      "database": "/var/lib/jig/jig.db",
      "dataDir": "/var/lib/jig",
      "concurrency": 50,
      "model": "deepseek-flash",
      "gatewayBaseUrl": "http://jig-gateway.jig.svc:8081/anthropic",
      "runner": "kubernetes",
      "kubernetes": { "image": "registry.example.com/jig-worker:0.1.0", "ttlSecondsAfterFinished": 600 },
      "tenants": []
    }
