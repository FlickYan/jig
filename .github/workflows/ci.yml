name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: test (${{ matrix.os }}, Node ${{ matrix.node }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install bubblewrap, jig's sandbox on Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap
          # Ubuntu 24.04 lets only programs with an AppArmor profile create user namespaces, which
          # bubblewrap needs when it isn't run as root.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
      - run: npm ci
      - run: npm run typecheck
      - name: Tests (the sandbox tests run on both systems)
        run: npm test

  services:
    # The task service's and the gateway's tests against a real Postgres and Redis of the job's own: without
    # JIG_TEST_POSTGRES_URL and JIG_TEST_REDIS_URL those halves are skipped.
    runs-on: ubuntu-latest
    # The tests take about a minute; a test that hangs fails at its own timeout, and the job at this.
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: jig
          POSTGRES_PASSWORD: jigtest
          POSTGRES_DB: jig
        ports:
          - 5432:5432
        options: --health-cmd "pg_isready -U jig" --health-interval 2s --health-timeout 5s --health-retries 30
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
    env:
      JIG_TEST_POSTGRES_URL: postgres://jig:jigtest@127.0.0.1:5432/jig
      JIG_TEST_REDIS_URL: redis://127.0.0.1:6379/1
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node --test --test-timeout=120000 test/server-*.test.ts test/redis.test.ts

  benchmark-tasks:
    # Every task must be solvable (the reference solutions pass) and not already solved (doing nothing
    # fails). No model is called.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node bench/run.ts --agent oracle
      - run: node bench/run.ts --agent noop
      - run: node bench/run.ts --suite evolve --agent oracle
      - run: node bench/run.ts --suite evolve --agent noop
      - run: node bench/run.ts --suite evolve2 --agent oracle
      - run: node bench/run.ts --suite evolve2 --agent noop
      - run: node bench/run.ts --suite explore --agent oracle
      - run: node bench/run.ts --suite explore --agent noop

  package:
    # The npm package runs JavaScript compiled from src/ (Node won't strip types under node_modules):
    # pack it, install the tarball the way a user would, and run it.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm pack
      - run: npm install -g ./*.tgz
      - run: jig --version && jig --help
      - name: Import runTask from the package, installed in a project of its own
        run: |
          mkdir "$RUNNER_TEMP/uses-jig" && cp ./*.tgz "$RUNNER_TEMP/uses-jig/"
          cd "$RUNNER_TEMP/uses-jig" && npm init -y && npm install ./*.tgz
          node -e "import('jig-agent').then(({ runTask }) => { if (typeof runTask !== 'function') throw new Error('runTask is ' + typeof runTask) })"
