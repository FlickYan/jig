name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: test (${{ matrix.os }}, Node ${{ matrix.node }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install bubblewrap, jig's sandbox on Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap
          # Ubuntu 24.04 lets only programs with an AppArmor profile create user namespaces, which
          # bubblewrap needs when it isn't run as root.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
      - run: npm ci
      - run: npm run typecheck
      - name: Tests (the sandbox tests run on both systems)
        run: npm test

  postgres:
    # The task service's tests on Postgres as well as SQLite: they skip that half without
    # JIG_TEST_POSTGRES_URL, which here names a Postgres of the job's own.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: jig
          POSTGRES_PASSWORD: jigtest
          POSTGRES_DB: jig
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 2s --health-timeout 5s --health-retries 30
    env:
      JIG_TEST_POSTGRES_URL: postgres://jig:jigtest@127.0.0.1:5432/jig
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node --test test/server-*.test.ts

  benchmark-tasks:
    # Every task must be solvable (the reference solutions pass) and not already solved (doing nothing
    # fails). No model is called.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node bench/run.ts --agent oracle
      - run: node bench/run.ts --agent noop
      - run: node bench/run.ts --suite evolve --agent oracle
      - run: node bench/run.ts --suite evolve --agent noop
      - run: node bench/run.ts --suite evolve2 --agent oracle
      - run: node bench/run.ts --suite evolve2 --agent noop
      - run: node bench/run.ts --suite explore --agent oracle
      - run: node bench/run.ts --suite explore --agent noop

  package:
    # The npm package runs JavaScript compiled from src/ (Node won't strip types under node_modules):
    # pack it, install the tarball the way a user would, and run it.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm pack
      - run: npm install -g ./*.tgz
      - run: jig --version && jig --help
